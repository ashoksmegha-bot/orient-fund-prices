<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Future Invest</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: dark-blue masthead with the inputs, a big result band, then fund cards, a horizon ladder and the compounding breakup at the bottom. */
:root{--navy:#06223d;--blue:#0084cc;--blue-d:#005f9e;--sky:#e6f4fc;--ink:#14213d;--ink2:#51607a;--line:#dde5ee;--bg:#f3f7fb;--card:#ffffff;--good:#0a8f63;--warn:#b86e00;--bad:#c0392b;
--disp:'Sora','Segoe UI',system-ui,sans-serif;--body:'Source Sans 3','Segoe UI',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--disp);margin:0;text-wrap:balance}
.mast{background:linear-gradient(135deg,#06223d 0%,#0a3d6b 60%,#0084cc 140%);color:#fff;padding:26px 16px 96px}
.in{max-width:1080px;margin:0 auto}
.brand{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.mast h1{font-size:30px;font-weight:700;letter-spacing:-.01em}.mast p.lead{margin:6px 0 0;color:#cfe6f6;max-width:640px}
.chip0{font-size:12px;color:#cfe6f6;border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:4px 11px}
.panel{max-width:1080px;margin:-72px auto 0;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:0 6px 24px rgba(6,34,61,.08)}
.form{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:16px 20px;align-items:start}
.form label,.lbl{display:block;font:600 12px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
input[type=text],input[type=number],select{width:100%;font:500 17px var(--body);color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid #8fd0f2;outline-offset:1px;border-color:var(--blue)}
.addrow{display:flex;gap:8px}.addrow input{flex:1}
button{font:600 15px var(--body);cursor:pointer;border-radius:10px;border:0;min-height:44px;padding:0 16px}
.go{background:var(--blue);color:#fff}.go:hover{background:var(--blue-d)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}.seg button{flex:1;background:#fff;color:var(--ink2);border-radius:0;min-height:42px;padding:0 8px}
.seg button.on{background:var(--navy);color:#fff}
.span2{grid-column:span 2}.rng{width:100%;accent-color:var(--blue);margin:6px 0 0}.rv{font:700 22px var(--disp);color:var(--blue-d)}
.form>*{min-width:0}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fc{display:flex;align-items:center;gap:8px;background:var(--sky);border:1px solid #bfe0f4;border-radius:10px;padding:6px 8px 6px 10px;max-width:100%}
.fc b{font-family:var(--disp);color:var(--blue-d)}.fc span.n{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}
.fc input{width:62px;min-height:34px;padding:2px 6px;font-size:15px;text-align:right}.fc button{min-height:30px;padding:0 8px;background:#fff;color:var(--bad);border:1px solid #f0c9c4}
.msg{font-size:14px;margin-top:8px}.msg.bad{color:var(--bad)}.msg.ok{color:var(--good)}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 40px;display:flex;flex-direction:column;gap:22px}
.band{background:var(--navy);color:#fff;border-radius:16px;padding:22px 22px 20px}
.band h2{font-size:15px;font-weight:600;color:#9fd3f2;letter-spacing:.04em;text-transform:uppercase}
.sentence{font:600 20px/1.35 var(--disp);margin:8px 0 16px;max-width:820px}.sentence em{font-style:normal;color:#7fd0ff}
.scn{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sc{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left;color:#fff;min-height:0;display:block;font-weight:400}
.sc.on{background:#fff;color:var(--ink);border-color:#fff}
.sc .t{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;opacity:.8}.sc .v{display:block;font:800 34px/1.1 var(--disp);margin-top:6px;font-variant-numeric:tabular-nums}
.sc.on .v{color:var(--blue-d)}.sc .p{display:block;font:600 15px var(--body);margin-top:4px;opacity:.9}.sc small{display:block;font-size:12.5px;opacity:.75;margin-top:6px}
.paidline{margin-top:14px;font-size:14.5px;color:#cfe6f6}
h2.sec{font-size:22px;font-weight:700}.sub{color:var(--ink2);margin:4px 0 14px;max-width:760px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.fund{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.fund h3{font-size:17px;font-weight:700;line-height:1.25}.fund .orig{font-size:12px;color:var(--ink2);margin-top:2px;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--sky);color:var(--blue-d);margin:6px 6px 0 0}.tag.g{background:#e3f6ee;color:var(--good)}.tag.w{background:#fdf0dc;color:var(--warn)}.tag.b{background:#fbe6e3;color:var(--bad)}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:12px 0 4px;font-size:14px}dt{color:var(--ink2)}dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.ret{display:grid;grid-template-columns:44px 1fr 56px;gap:6px 8px;align-items:center;font-size:13px;margin-top:10px}.ret .b{height:9px;background:#eef2f7;border-radius:5px;position:relative;overflow:hidden}.ret .b i{position:absolute;top:0;bottom:0;border-radius:5px}
.ret .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.lnk{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:13.5px}.lnk a{color:var(--blue-d);font-weight:600}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}th{font:600 11.5px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);background:#f6f9fc;text-align:right;padding:10px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
tr.sel td{background:var(--sky);font-weight:600}td.big{font:700 16px var(--disp)}td small{display:block;font:500 12px var(--body);color:var(--ink2)}
tr.ph td:first-child{border-left:4px solid var(--blue)}tr.gr td:first-child{border-left:4px solid #9bd5f3}.neg{color:var(--bad)}.pos{color:var(--good)}
.kp3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.kp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kp .l{font:600 12px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}.kp .v{font:800 28px/1.15 var(--disp);margin-top:4px;font-variant-numeric:tabular-nums}.kp.hl .v{color:var(--blue-d)}
.share{margin-top:12px;height:18px;border-radius:9px;overflow:hidden;display:flex;background:#eef2f7}.share i{display:block;height:100%}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2);margin:8px 0}.lg span{display:flex;align-items:center;gap:6px}.lg b{width:12px;height:12px;border-radius:3px;display:inline-block}
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0}.ins{background:var(--sky);border-radius:12px;padding:12px 14px;font-size:15px}.ins b{display:block;font:700 18px var(--disp);color:var(--blue-d)}
svg text{font:12px var(--body);fill:var(--ink2)}svg .tx{fill:var(--ink)}
.note{font-size:13.5px;color:var(--ink2);max-width:860px}.warnb{background:#fff6e5;border:1px solid #f1d49b;color:#6b4300;border-radius:12px;padding:10px 14px;font-size:14.5px}
.empty{background:var(--card);border:1px dashed #b9c9da;border-radius:14px;padding:26px;text-align:center;color:var(--ink2)}
#tip{position:fixed;pointer-events:none;background:var(--navy);color:#fff;font-size:12.5px;padding:7px 10px;border-radius:8px;display:none;z-index:9;line-height:1.45}
.foot{font-size:13px;color:var(--ink2);border-top:1px solid var(--line);padding-top:14px}.cp{background:#fff;color:var(--blue-d);border:1.5px solid var(--blue);min-height:40px}
@media(max-width:860px){.form{grid-template-columns:1fr 1fr}.span2{grid-column:span 2}.kp3,.scn{grid-template-columns:1fr}.mast h1{font-size:25px}.sentence{font-size:18px}}
@media(max-width:520px){.form{grid-template-columns:minmax(0,1fr)}.fc span.n{max-width:120px}.span2{grid-column:auto}}
@media(prefers-reduced-motion:no-preference){.sc,button{transition:background .15s,color .15s}}
.logo{background:#fff;border-radius:12px;padding:8px 14px;display:flex;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.18)}.logo img{height:46px;width:auto;display:block}.top{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}.top .co{color:#cfe6f6;font-size:12px;letter-spacing:.14em}.fl a{color:#0a6fb5;font-weight:600;text-decoration:none}</style></head><body>

 $('asof').textContent=L.state==='loading'?'Getting the latest fund prices…':L.state==='on'?'Live prices: '+L.n+' of '+FUNDS.length+' funds updated · feed checked '+fm(L.checked)+' · NAV date shown on each fund':'Price feed not reachable – showing FT/BlackRock prices saved '+'2026-11-23'+' (NAV date shown on each fund)'}
function boot(){idx();$('fl').innerHTML=FUNDS.map(f=>`<option value="${f.code}">${esc(short(f.name))}</option>`).join('');segs();head();S.sel=[{code:'181',w:50},{code:'131',w:50}].filter(s=>byCode.has(s.code));render()}
boot();
/* live data from the owner's database, when a newer fund file has been published */
function applyLive(d){try{if(!d||!Array.isArray(d.funds)||!d.funds.length||!d.retAsof)return;const a=toD(d.retAsof),b=toD(META.retAsof);if(!a||(b&&a<b))return;
 if(d.retAsof==META.retAsof&&d.listAsof==META.listAsof&&FUNDS.length==d.funds.length&&FUNDS[0].nav==d.funds[0].nav)return;FUNDS.length=0;d.funds.forEach(f=>FUNDS.push(f));META.retAsof=d.retAsof;META.listAsof=d.listAsof||META.listAsof;
 S.sel=S.sel.filter(s=>FUNDS.some(f=>f.code==s.code));if(S.sel.length)equalize();idx();$('fl').innerHTML=FUNDS.map(f=>`<option value="${f.code}">${esc(short(f.name))}</option>`).join('');head();render()}catch(e){}}
(async()=>{try{if(typeof claude==='undefined'||!claude.use)return;const db=await claude.use('db');if(!db)return;db.doc('live/funds').onSnapshot(s=>{try{if(!s)return;const ex=typeof s.exists==='function'?s.exists():s.exists;if(!ex)return;applyLive(typeof s.data==='function'?s.data():s.data)}catch(e){}},()=>{})}catch(e){}})();


/* LIVE PRICES: loads the latest NAVs collected every 3 hours by the free GitHub job (FT Markets + BlackRock). */
var LIVE={state:'loading'};
(function(){
 const SRC=['https://raw.githubusercontent.com/ashoksmegha-bot/orient-fund-prices/main/prices.json',
            'https://cdn.jsdelivr.net/gh/ashoksmegha-bot/orient-fund-prices@main/prices.json'];
 async function get(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);
  try{const r=await fetch(u+'?t='+Date.now(),{cache:'no-store',signal:c.signal});if(!r.ok)return null;const d=await r.json();return d&&d.funds?d:null}catch(e){return null}finally{clearTimeout(t)}}
 function apply(d){let n=0;FUNDS.forEach(f=>{const v=d.funds[f.code];
  if(!v||!(v.nav>0)||(v.isin&&f.isin&&v.isin!==f.isin))return;
  if(String(v.date)>=String(f.lpd||'')){f.nav=v.nav;f.lpd=v.date;f.psrc=v.src+(v.stale?', last good price':'');if(v.url)f.link=v.url;n++}});return n}
 async function run(){LIVE={state:'loading'};head();let d=null;for(const u of SRC){d=await get(u);if(d)break}
  if(!d){LIVE={state:'off'};head();return}
  const n=apply(d);LIVE={state:'on',n,checked:d.checked_utc};head();try{render()}catch(e){}}
 window.refreshPrices=run;
 const b=document.getElementById('prf');if(b)b.onclick=run;
 run();
})();
</script></body></html>
